<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrivePulse — Laporan Analisis Drive</title>
    <style>
        /* TODO: Styling di milestone v1.2 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .status-critical { color: #ff4757; }
        .status-warning { color: #ffa502; }
        .status-safe { color: #2ed573; }
        .category-safe { border-left: 4px solid #2ed573; padding-left: 12px; }
        .category-check { border-left: 4px solid #ffa502; padding-left: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #333; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧹 DrivePulse — Laporan Analisis</h1>
        <p>Tanggal: {{DATE}}</p>
    </div>

    <section>
        <h2>📊 Status Drive</h2>
        <!-- TODO: Template variables akan di-replace oleh report.ps1 -->
        <p>Drive: {{DRIVE}} | Total: {{TOTAL_GB}} GB | Terpakai: {{USED_GB}} GB ({{USED_PCT}}%)</p>
    </section>

    <section>
        <h2>✅ Aman Dihapus</h2>
        <!-- {{SAFE_ITEMS}} -->
    </section>

    <section>
        <h2>❓ Perlu Dicek Manual</h2>
        <!-- {{CHECK_ITEMS}} -->
    </section>

    <section>
        <h2>💡 Rekomendasi</h2>
        <!-- {{RECOMMENDATIONS}} -->
    </section>

    <footer>
        <p>Generated by DrivePulse v{{VERSION}}</p>
    </footer>
</body>
</html>
